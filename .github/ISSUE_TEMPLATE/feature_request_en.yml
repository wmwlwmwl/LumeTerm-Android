name: Feature Request (English)
description: Suggest a new feature or improvement for LumeTerm on Android
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > Please search [existing issues](https://github.com/wmwlwmwl/LumeTerm-Android/issues?q=is%3Aissue) first to avoid duplicates.
        >
        > If someone already asked for the same thing, add your use case to that issue instead of opening a new one.
        >
        > Desktop (Windows / macOS / Linux) requests go to the [LumeTerm](https://github.com/wmwlwmwl/LumeTerm/issues/new/choose) repository.

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - SSH connection / session / background keep-alive
        - Terminal (rendering, input, keyboard, copy & paste)
        - Servers / groups / credentials
        - Quick commands
        - Proxy nodes
        - Cloud sync (WebDAV / R2 / FTP / SFTP)
        - Import & export / encrypted backup
        - UI / theme / language
        - Other / new module
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem you want to solve
      description: Describe the pain point and *why* you need this
      placeholder: Switching servers takes too many taps going back and forth ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: How should it work? Be specific (sketches and screenshots welcome)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: How do you work around it today, and why isn't that enough?
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Who benefits?
      options:
        - Only me
        - Some users
        - Most Android users
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Reference implementations in other apps, mobile-specific constraints, etc.
    validations:
      required: false
