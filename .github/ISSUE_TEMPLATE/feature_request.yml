name: 功能建议
description: 为 Android 端提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 提交前请先搜索 [现有 Issues](https://github.com/wmwlwmwl/LumeTerm-Android/issues?q=is%3Aissue)，避免重复提议。
        >
        > 若已有人提出相同或相近需求，请直接在原 Issue 下补充使用场景，而不是新建。
        >
        > 桌面端（Windows / macOS / Linux）需求请到 [LumeTerm](https://github.com/wmwlwmwl/LumeTerm/issues/new/choose) 提交。

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - SSH 连接 / 会话 / 后台保活
        - 终端（渲染、输入、键盘、复制粘贴）
        - 服务器 / 分组 / 凭据
        - 快捷命令
        - 代理节点
        - 云同步（WebDAV / R2 / FTP / SFTP）
        - 导入导出 / 加密备份
        - 界面 / 主题 / 语言
        - 其他 / 新模块
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前遇到的困境或低效之处，说明「为什么」需要它
      placeholder: 手机上切换服务器需要多次返回，希望 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？越具体越好（可附草图或截图）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 现在是如何绕过的？为什么不够用？
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 影响范围
      options:
        - 只影响我个人
        - 部分用户需要
        - 大多数 Android 用户都会受益
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 同类软件参考实现、移动端适配要点等
    validations:
      required: false
