name: 问题反馈（Bug）
description: 提交 Android 端的功能异常、闪退或显示错误
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > 提交前请先确认：
        > 1. 已在 [Releases](https://github.com/wmwlwmwl/LumeTerm-Android/releases) 检查是否为最新版
        > 2. 已搜索 [现有 Issues](https://github.com/wmwlwmwl/LumeTerm-Android/issues?q=is%3Aissue) 避免重复
        >
        > ⚠️ **请勿直接粘贴本机配置或导出文件内容**：其中含密码、私钥、代理口令等明文。贴日志前请务必脱敏（主机、用户名、IP、路径替换为 `example.com`、`user` 等占位符）。
        >
        > 桌面端（Windows / macOS / Linux）问题请到 [LumeTerm](https://github.com/wmwlwmwl/LumeTerm/issues/new/choose) 提交。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 中显示的版本号（对应根目录 VERSION）
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android 版本
      description: 系统设置 → 关于手机 中的 Android 版本
      placeholder: Android 14
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号 / ROM
      placeholder: 小米 14 / MIUI 14 / Pixel 8 / 原生
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - SSH 连接 / 会话 / 后台保活
        - 终端（渲染、输入、键盘、复制粘贴）
        - 服务器 / 分组 / 凭据
        - 快捷命令
        - 代理节点
        - 云同步（WebDAV / R2 / FTP / SFTP）
        - 导入导出 / 加密备份
        - 界面 / 主题 / 语言
        - 自动更新
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: server-os
    attributes:
      label: 远端服务器系统（如涉及）
      placeholder: Ubuntu 22.04 / CentOS 7 / 不涉及
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按序号写明每一步操作，便于复现
      placeholder: |
        1. 新建服务器，认证方式选择「私钥」
        2. 点击连接
        3. 连接成功后切到后台，通知栏显示 ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 说明实际发生了什么（闪退、报错、显示异常等）。闪退请注明是否弹出崩溃提示，或标注「见截图 / 录屏」
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: 可附应用内日志或 logcat；请逐行检查并删除密码、密钥与真实主机地址后再粘贴。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: frequency
    attributes:
      label: 复现频率
      options:
        - label: 每次都复现
        - label: 偶尔出现（有随机性）
        - label: 仅出现一次

  - type: checkboxes
    id: checklist
    attributes:
      label: 我已确认（提交前请自行核对）
      options:
        - label: 已升级到最新版本仍复现
        - label: 日志与截图中的敏感信息已脱敏
        - label: 该问题与桌面端无关（Android 端单独复现）

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 截图或录屏可直接拖拽到下方输入框
    validations:
      required: false
